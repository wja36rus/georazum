<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Гео Разум — отчет по участку</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="container site-header__inner">
                <a class="logo" href="index.html"
                    ><span class="logo__mark">◈</span> Гео Разум</a
                >
                <div class="header-actions">
                    <div class="header-auth" data-auth>
                        <button
                            class="btn btn--ghost"
                            type="button"
                            data-open-modal="login"
                            data-auth-guest
                        >
                            Войти
                        </button>
                        <span class="header-auth__user" data-auth-user hidden>
                            <a
                                class="header-auth__name"
                                href="cabinet.html"
                                data-auth-name
                                >Иван Иванов</a
                            >
                            <button
                                class="btn btn--ghost"
                                type="button"
                                data-logout
                            >
                                Выйти
                            </button>
                        </span>
                    </div>
                    <a class="btn btn--accent" href="order.html"
                        >Получить отчет</a
                    >
                </div>
            </div>
        </header>

        <main>
            <section class="hero">
                <div class="container">
                    <h1>Гео Разум. Цифровой интеллект вашей земли.</h1>
                    <form class="hero-console" data-hero-form>
                        <input
                            type="text"
                            name="query"
                            aria-label="Кадастровый номер или адрес участка"
                            placeholder="Введите кадастровый номер или адрес участка..."
                        />
                        <button class="btn btn--accent btn--lg" type="submit">
                            Узнать, что скрывает участок →
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <div
            class="modal"
            id="modal-login"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-login-title"
        >
            <div class="modal__panel">
                <h3 id="modal-login-title">Вход</h3>
                <div class="form-field">
                    <label for="login-email">Email</label>
                    <input
                        class="field"
                        id="login-email"
                        type="email"
                        placeholder="ivan@mail.ru"
                        autocomplete="email"
                    />
                </div>
                <div class="form-field">
                    <label for="login-pass">Пароль</label>
                    <input
                        class="field"
                        id="login-pass"
                        type="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    />
                </div>
                <p class="small muted">
                    Вход имитируется: введите любые данные и нажмите «Войти».
                </p>
                <p class="form-note" data-login-note aria-live="polite"></p>
                <button
                    class="btn btn--accent btn--wide"
                    type="button"
                    data-login-submit
                >
                    Войти →
                </button>
                <button
                    class="btn btn--ghost btn--wide"
                    type="button"
                    data-close-modal
                >
                    Отмена
                </button>
            </div>
        </div>

        <script src="vendor/jquery.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>

name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build client for Pages
        working-directory: client
        env:
          NODE_ENV: production
          # Базовый путь репозитория: https://<user>.github.io/georazum/
          BASE_PATH: /georazum/
          # Адрес развёрнутого API (Render/Railway и т.п.). Если не задан —
          # сборка автоматически использует моки (USE_MOCKS), и сайт работает
          # на статике без бэкенда. Укажите свой URL, чтобы включить API:
          API_URL: ${{ vars.API_URL }}
        run: npm run build

      - name: SPA fallback (react-router на GitHub Pages)
        working-directory: client
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
